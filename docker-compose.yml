version: '3.8'

services:
  r4softia-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r4softia-landing-app
    restart: always
    ports:
      - "8010:80"
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - r4softia-network

networks:
  r4softia-network:
    driver: bridge
